# Substreams only, no live component: tier1 serves from the merged blocks generated by
# gen-blocks.sh. Store snapshots are saved every 100 blocks (small segments) so a short
# range yields many snapshots to prune.
start:
  args:
    - substreams-tier1
    - substreams-tier2
  flags:
    common-live-blocks-addr: ""
    advertise-block-id-encoding: "hex"
    advertise-chain-name: "acme-dummy-blockchain"
    substreams-state-bundle-size: 100
    substreams-tier1-max-subrequests: 8
    # Explicit loopback: tier1 opens one gRPC connection per job, and the default
    # ":10017" goes through the gRPC DNS resolver, which can add seconds per job on
    # some networks.
    substreams-tier1-subrequests-endpoint: 127.0.0.1:10017
