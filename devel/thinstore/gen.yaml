# Used once to generate merged blocks with the dummy blockchain. The chain produces its
# whole history as a genesis burst, then stops; gen-blocks.sh kills the stack once the
# merged-blocks store holds the target range. No relayer: it cannot link a burst that
# large, and the merger only needs the one-block files.
start:
  args:
    - reader-node
    - merger
  flags:
    advertise-block-id-encoding: "hex"
    advertise-chain-name: "acme-dummy-blockchain"
    reader-node-path: "dummy-blockchain"
    reader-node-data-dir: "{data-dir}/reader-node"
    reader-node-arguments: start
      --tracer=firehose
      --store-dir="{node-data-dir}"
      --block-rate=60000
      --block-size=1KiB
      --genesis-height=0
      --genesis-block-burst=$THINSTORE_BLOCKS
      --stop-height=$THINSTORE_BLOCKS
