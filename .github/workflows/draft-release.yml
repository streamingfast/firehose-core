name: Draft release

on:
  pull_request:
    branches:
      - "develop"
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draft-release-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  SFRELEASER_VERSION: "v0.17.1-rc.4"

jobs:
  draft-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install sfreleaser
        run: |
          curl -sSfL "https://github.com/streamingfast/sfreleaser/releases/download/$SFRELEASER_VERSION/sfreleaser_linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" sfreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Detect version
        id: detect
        run: sfreleaser release detect

      - name: Comment release notes
        if: steps.detect.outputs.is_release_pr && github.event_name == 'pull_request'
        env:
          PREVIEW: ${{ steps.detect.outputs.preview_comment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$PREVIEW"

      - name: Set up Go
        if: steps.detect.outputs.is_release_pr
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Cache zig
        if: steps.detect.outputs.is_release_pr
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sfreleaser
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ env.SFRELEASER_VERSION }}

      - name: Prepare release
        if: steps.detect.outputs.is_release_pr
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sfreleaser release prepare "$VERSION" --yes
