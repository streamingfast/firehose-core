name: Draft release

on:
  push:
    branches:
      - "develop"
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: draft-release
  cancel-in-progress: false

env:
  CHANGELOG_PATH: "CHANGELOG.md"
  SFRELEASER_DISABLE_PTY: "true"
  SFRELEASER_VERSION: "v0.17.1-rc.2"

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install sfreleaser
        run: |
          curl -sSfL "https://github.com/streamingfast/sfreleaser/releases/download/$SFRELEASER_VERSION/sfreleaser_linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" sfreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # On a push, a version already in the changelog before it or merged from a fork's pull
      # request is not released, a manual run releases the changelog's version as is.
      - name: Detect version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arguments=(--github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "push" ]]; then
            arguments+=(--before "$BEFORE" --skip-fork-pull-request)
          fi

          sfreleaser changelog detect-release "$CHANGELOG_PATH" "${arguments[@]}"

      - name: Set up Go
        if: steps.version.outputs.version != ''
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Create draft release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sfreleaser release "$VERSION" --non-interactive --builder=native --brew-deferred
